name: Deploy to GitHub Pages

# This file is the SOURCE-OF-TRUTH DEFINITION, owned and maintained by
# the private source repository (.github/deploy-repo-pages-workflow.yml),
# of the deploy repository's own Pages workflow. It is not an active
# workflow in this repository -- it is not under .github/workflows/ here,
# so it never runs in the source repo itself.
#
# It is pushed to the deploy repo's .github/workflows/pages.yml exactly
# ONCE, out-of-band, by an administrator with normal repo write access --
# NOT by deploy-preview-repo.yml's constrained DEPLOY_REPO_TOKEN, which
# deliberately has only Contents:Read/write and nothing else. GitHub
# refuses to let any token without `workflow` scope create or update a
# file under .github/workflows/, by design (an anti-privilege-escalation
# protection: a repo-scoped write credential should not be able to
# silently plant CI). Since that scope is never needed for anything else
# this pipeline does, the fix is to never ask for it, not to work around
# the protection -- deploy-preview-repo.yml's publish step explicitly
# never touches .github/ on every subsequent run; only this one bootstrap
# push does. Bootstrap command (run once, as an admin, when the deploy
# repo is first created):
#
#   gh api --method PUT repos/<owner>/<deploy-repo>/contents/.github/workflows/pages.yml \
#     -f message="Bootstrap: add Pages deploy workflow (one-time, admin-pushed)" \
#     -f content="$(base64 < .github/deploy-repo-pages-workflow.yml | tr -d '\n')" \
#     -f branch="main"
#
# Minimal by design: the deploy repository contains no source code, no
# npm tooling, no CI, no CodeQL, no Dependabot config -- only the static
# artifact and this one workflow, which does nothing but publish whatever
# tree it's given to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Exclude this workflow directory from the published artifact
        # The whole repository IS the artifact here -- there is no build
        # step in this repository -- but .github/ (this workflow file
        # itself) must not be served as part of the live site. The
        # workflow's own definition was already loaded before this step
        # runs, so removing the file now doesn't affect this run.
        run: rm -rf .github

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
          # Next.js's own build already ran `touch out/.nojekyll`
          # upstream, so this repository's checkout already has it.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
