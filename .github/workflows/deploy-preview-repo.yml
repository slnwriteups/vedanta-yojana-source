name: Deploy Preview (temporary public deploy repo)

# Phase 1 of the private-source/public-deployment migration. Builds and
# publishes the SAME verified static export deploy-pages.yml already
# produces, but to a separate, temporary public repository instead of this
# repo's own GitHub Pages -- so the real pipeline (build -> verify ->
# publish) can be exercised end-to-end without touching the current
# production site at https://slnwriteups.github.io/vedanta-yojana/.
#
# deploy-pages.yml is completely untouched and keeps deploying production
# exactly as before. This workflow is manual-only (workflow_dispatch, no
# push trigger) for the duration of this testing phase -- it never runs
# unless someone explicitly triggers it.
#
# Once the temporary deploy repository and its scoped credential exist
# (see the Phase 1 report for exact manual setup steps), this workflow is
# safe to run repeatedly: every run fully replaces every file in the
# deploy repo EXCEPT .github/ (see the publish step below for exactly
# why), so a failed or stale prior run never leaves anything behind in
# the actual public artifact.
#
# .github/deploy-repo-pages-workflow.yml is the source-of-truth
# definition of the deploy repo's own Pages workflow, but it is pushed
# there ONCE, out-of-band, by an administrator (not by this workflow's
# constrained DEPLOY_REPO_TOKEN) -- GitHub refuses to let a token without
# `workflow` scope create or update anything under .github/workflows/,
# which a Contents-only fine-grained PAT deliberately does not have (and
# should not have: that scope isn't needed for anything else this
# pipeline does). See that file's own doc comment for the bootstrap
# command.
on:
  workflow_dispatch:
    inputs:
      deploy_repo:
        description: 'Target "owner/repo" for this run. Leave empty to use the DEPLOY_REPO repository variable.'
        required: false
        type: string

# Least privilege: this job only reads the source repo and builds it
# locally in the runner. It never writes back to THIS repository -- the
# publish step authenticates to the destination repo with the separate
# DEPLOY_REPO_TOKEN secret, never with this job's own GITHUB_TOKEN, so
# GITHUB_TOKEN never needs (and never gets) `contents: write`.
permissions:
  contents: read

# A dedicated group, distinct from deploy-pages.yml's "pages" group --
# this pipeline is unrelated to the production deploy and must never be
# able to block or race it.
concurrency:
  group: deploy-preview-repo
  cancel-in-progress: false

jobs:
  build-verify-publish:
    name: Build, verify, and publish preview artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build
        # Identical env vars to deploy-pages.yml's production build -- the
        # temporary deploy repo intentionally gets a build whose asset
        # paths still say /vedanta-yojana (per design: this phase verifies
        # the pipeline and artifact, not the final URL; the temporary
        # repo's own Pages URL will not match those asset paths yet, and
        # that mismatch is expected and correct for this phase).
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://slnwriteups.github.io
          NEXT_PUBLIC_BASE_PATH: /vedanta-yojana

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Remove internal documentation from the public artifact
        # out/README.md is public/README.md, copied verbatim by `next
        # build` -- legitimate source documentation for developers (it
        # explains the /public directory), but it has no function on the
        # live site and must not cross into the public deploy repo. Removed
        # here, at the publishing boundary, rather than editing
        # public/README.md itself, which stays exactly as-is for the
        # private source repo.
        run: rm -f out/README.md

      - name: Verify public build is safe to publish
        # scripts/verify-public-build.ts is the single authoritative
        # implementation of this gate -- see that file for the complete,
        # commented check list. A non-zero exit here fails this step,
        # which stops the job before the publish step ever runs: nothing
        # is published unless every check in that script passes.
        run: node scripts/verify-public-build.ts out

      - name: Publish to temporary deploy repository
        env:
          DEPLOY_REPO: ${{ inputs.deploy_repo || vars.DEPLOY_REPO }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_REPO}" ] || [ -z "${DEPLOY_TOKEN}" ]; then
            echo "DEPLOY_REPO and/or DEPLOY_REPO_TOKEN are not configured yet."
            echo "Build and verification succeeded -- publish is skipped until the"
            echo "temporary deploy repository and its scoped credential are manually"
            echo "created (see the Phase 1 report for exact setup steps)."
            exit 0
          fi

          echo "Publishing verified build to ${DEPLOY_REPO}..."

          # Clone the deploy repo (its .github/workflows/pages.yml was
          # bootstrapped there once, out-of-band, by an administrator --
          # see this workflow's top-of-file comment). Constructed only in
          # this shell's environment, never echoed or logged; GitHub
          # Actions also masks the secret's literal value in any log
          # output as a second layer of protection.
          rm -rf /tmp/deploy-checkout
          git clone -q --depth 1 "https://x-access-token:${DEPLOY_TOKEN}@github.com/${DEPLOY_REPO}.git" /tmp/deploy-checkout
          cd /tmp/deploy-checkout
          git config user.name "vedanta-yojana-deploy-bot"
          git config user.email "actions@users.noreply.github.com"

          # Remove every existing top-level entry EXCEPT .git (this
          # clone's own metadata) and .github (the bootstrapped Pages
          # workflow -- this token cannot touch it anyway, and it isn't
          # part of the build artifact). This is the actual "no stale
          # files survive" guarantee: whatever isn't in the fresh out/
          # tree we're about to copy in is deleted here first.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          # Copy in the complete fresh, verified artifact.
          cp -a "${GITHUB_WORKSPACE}/out/." .

          git add -A
          git commit -q -m "Publish verified build from ${{ github.repository }}@${{ github.sha }}" --allow-empty
          git push -q origin HEAD:main

          echo "Published to ${DEPLOY_REPO}."
