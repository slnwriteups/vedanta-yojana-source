name: Deploy announcement push service
on:
  push:
    branches: [main, 'feature/announcement-push']
    paths:
      - 'cloudflare/announcement-push/**'
      - '.github/workflows/deploy-announcement-push.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-announcement-push
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Test delivery, targeting and opt-out
        run: node --test cloudflare/announcement-push/core.test.mjs
      - name: Validate Worker
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/announcement-push/wrangler.toml --outdir /tmp/announcement-push-dryrun
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Announcement push is not deployed: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
          npx --yes wrangler@4 deploy --config cloudflare/announcement-push/wrangler.toml
