name: Cloudflare cleanup (one-off)

# One-off, requested by the repository owner: identify the retired
# panchangam-proxy Worker (the Panchangam no longer calls any calendar
# service). Runs only on pushes to this working branch; never on main.
on:
  push:
    branches: [claude/replica-skill-install-ss2qi1]
    paths: [".github/workflows/cloudflare-cleanup.yml"]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List Workers (read-only)
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "workers.dev subdomain:"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -c '{success, subdomain: .result.subdomain, errors}'
          echo "scripts:"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq -c '{success, errors, scripts: [.result[]? | {id, created_on, modified_on}]}'
