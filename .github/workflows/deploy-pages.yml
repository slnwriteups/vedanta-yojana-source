name: Deploy to GitHub Pages

# Deploys the static export produced by `npm run build` (Next.js
# `output: "export"` -> out/). Separate from ci.yml, which validates every
# push and pull request: this one only publishes, and only from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` so an in-flight
# publish finishes rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build
        # Runs prebuild (scripts/build-search-index.ts) first, then
        # `next build`, which exports to out/.
        #
        # NEXT_PUBLIC_SITE_URL is what turns canonical URLs, the sitemap's
        # <loc> values and robots.txt's Sitemap: line absolute. Only the
        # origin is read from it (see lib/site.ts). Served from the
        # vedantayojana.org custom domain (public/CNAME) at the root, so
        # no basePath is set -- see next.config.ts.
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://vedantayojana.org
          # Cloudflare Web Analytics site token (app/layout.tsx). A
          # repository VARIABLE, not a secret: it is public by design --
          # it appears in the HTML of every deployed page and grants
          # nothing but the ability to report page views into this
          # site's own bucket. Unset is a supported state: the beacon is
          # then simply not rendered, and the build is otherwise
          # identical, so a fork building this repository never reports
          # into this project's account.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          # Search-engine ownership tokens (app/layout.tsx), also
          # repository VARIABLES for the same reason: each is printed in
          # every page's HTML by design. Unset = no tag rendered. See
          # docs/SEO.md for where to get them.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - name: Disable Jekyll processing
        # Next.js emits _next/, and Jekyll strips underscore-prefixed
        # paths. The Pages Actions pipeline does not run Jekyll today, so
        # this is insurance against a future switch to branch-based
        # publishing rather than a live fix.
        run: touch out/.nojekyll

      - name: Publish privacy policy
        # docs/privacy-policy.html stays the single source (tests and
        # docs point at it); serving it at /privacy-policy.html gives the
        # App Store listing the public privacy-policy URL it requires.
        run: cp docs/privacy-policy.html out/privacy-policy.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Notify search engines (IndexNow)
        # Tells Bing (and through it DuckDuckGo, Yahoo and Copilot/ChatGPT
        # search), Yandex, Naver and Seznam that the sitemap's URLs
        # changed, so they recrawl within hours instead of whenever they
        # next get round to it. Google does not take part in IndexNow --
        # it reads the sitemap via Search Console (docs/SEO.md).
        #
        # The key is public by design: the protocol proves ownership by
        # the engine fetching it back from the site itself
        # (public/<key>.txt). Never fails the deploy -- the site is
        # already live by this step, and a missed ping only means a
        # slower recrawl.
        continue-on-error: true
        env:
          SITE: https://vedantayojana.org
          INDEXNOW_KEY: df341b3613b51c0f587a8717bf632eda
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | head -n 10000)
          jq -n --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" --arg keyLocation "$SITE/$INDEXNOW_KEY.txt" \
            --arg urls "$urls" '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > indexnow.json
          echo "Submitting $(jq '.urlList | length' indexnow.json) URLs"
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json -w "HTTP %{http_code}\n"
