name: Translation check

# Runs scripts/test-translation-quality.ts on the content files a pull
# request changes: paragraph parity with the English, Kannada/Telugu script
# leaks, native digits and gloss echo (docs/TRANSLATION-GUIDE.md §9). Then
# the translation engine (tools/translation-engine): its own tests, and its
# rulebook check of the changed files. Errors recorded in its baseline.json
# (historical defects) are listed as "known" and do not fail the check;
# every new error does.
# Free on a public repository. It needs no dependencies: the checker uses
# only Node's built-ins. Content schemas and typography are already checked
# by ci.yml's `npm run test:content`.
on:
  pull_request:
    paths:
      - "content/**"
      - "docs/translation-glossaries/**"
      - "scripts/translation/**"
      - "scripts/translation-*.ts"
      - "scripts/test-translation-quality.ts"
      - "tools/translation-engine/**"
      - "prompts/translation-prompt-card.md"

permissions:
  contents: read

jobs:
  translation-quality:
    name: Translation quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the check can diff against the base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Check changed translations
        run: |
          set +e
          node scripts/test-translation-quality.ts --changed=origin/${{ github.base_ref }} > translation-report.txt
          status=$?
          cat translation-report.txt
          {
            echo "### Translation check"
            echo '```'
            cat translation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Translation engine tests
        run: node --test tools/translation-engine/tests/*.test.ts

      - name: Rulebook check of changed content (new errors block, known ones are listed)
        run: |
          set +e
          node tools/translation-engine/cli.ts check --changed=origin/${{ github.base_ref }} > engine-report.txt
          status=$?
          cat engine-report.txt
          {
            echo "### Translation engine check"
            echo '```'
            cat engine-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
