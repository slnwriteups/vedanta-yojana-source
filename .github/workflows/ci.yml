name: CI

# Phase 5O -- minimum appropriate CI for this repository: checkout,
# reproducible install, then the same four checks already established as
# this project's authoritative validation commands (see package.json's
# "ci" script, which reproduces this exact sequence locally). No
# deployment step of any kind -- that is explicitly out of scope for this
# phase (Phase 5P).
#
# The mobile app's tests and type check follow the build: locally, run
# `npm ci` inside mobile/ once, then `npm run test:mobile` and
# `npm run typecheck:mobile` (after a build, which generates the book
# payloads those tests read).
on:
  push:
  pull_request:

# Least privilege: this job only reads the repo and builds it locally in the
# runner -- it never needs to write anything back (no PR comments, no
# check-run creation beyond the default one for this workflow itself).
permissions:
  contents: read

jobs:
  test:
    name: Test, typecheck, build (web and mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches .nvmrc / package.json's "engines" field -- this is
          # the exact Node major version the application was built and
          # tested against throughout this project. Node's zero-flag
          # native TypeScript execution (used by every `node --test`
          # script below) requires a sufficiently recent Node version;
          # this pin is deliberately not an arbitrary/minimal lower
          # bound guess.
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Content tests
        run: npm run test:content

      - name: Application tests
        run: npm run test:app

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # The Android/iOS app (mobile/) has its own dependencies and test
      # suite. Its tests read the book payloads that the build's prebuild
      # step just generated in public/books/, so they run after it.
      - name: Install mobile dependencies (reproducible)
        working-directory: mobile
        run: npm ci

      - name: Mobile tests
        run: npm run test:mobile

      - name: Mobile TypeScript
        run: npm run typecheck:mobile
